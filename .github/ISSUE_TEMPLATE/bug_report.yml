name: Bug report
description: Something Kairos does that it should not, or does not do that it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag you run, for example v0.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [linux/amd64, linux/arm64]
    validations:
      required: true
  - type: input
    id: oidc
    attributes:
      label: OIDC provider
      description: Pocket ID, Authentik, Keycloak, or another
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs kairos`, with secrets and invitee details removed
      render: text
