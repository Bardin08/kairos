version: 2
updates:
  # One stream per ecosystem, so a frontend bump can be merged while a backend
  # one waits. No auto-merge anywhere: every bump is a pull request a human reads,
  # and CI has to be green before it lands like any other change.
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message: { prefix: "chore(backend)" }
    groups:
      efcore: { patterns: ["Microsoft.EntityFrameworkCore*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message: { prefix: "chore(frontend)" }
    versioning-strategy: increase   # rewrites the exact pin; never introduces a range
    groups:
      react: { patterns: ["react", "react-dom", "@types/react*"] }
      vite: { patterns: ["vite", "@vitejs/*", "vitest"] }
    # React stays on 19.2: 19.3 adds 8.6 kB gzipped to the booking route (ViewTransition, Fragment refs, Trusted Types) for features Kairos does not use, and React keeps patching 19.2 alongside it. Patches still arrive; lift this when a newer minor is needed or the budget moves.
    ignore:
      - { dependency-name: "react", update-types: ["version-update:semver-minor"] }
      - { dependency-name: "react-dom", update-types: ["version-update:semver-minor"] }
      - { dependency-name: "@types/react*", update-types: ["version-update:semver-minor"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, ci]
