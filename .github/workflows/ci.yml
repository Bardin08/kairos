name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, never a push to main: two ships minutes
  # apart share one group, and main's history must not carry a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job ids are the required status check contexts on main. Do not rename them,
  # and do not give them a `name:` — that would change the context and silently
  # leave branch protection waiting on a check that never reports.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Directory.Packages.props
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet format --verify-no-changes
      - run: dotnet test --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: 26.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job is a required check, so it must report a conclusion even before
      # frontend/ exists. Skipped jobs never report, which would leave every pull
      # request unmergeable — so the job always runs and gates its real work on
      # the directory being there.
      - id: detect
        run: |
          if [ -d frontend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ does not exist yet — nothing to check."
          fi

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npx eslint . --max-warnings 0

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npx vitest run

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      # The budget and the "was anything actually built" guard live in the script,
      # so CI and scripts/verify.sh cannot drift apart.
      - if: steps.detect.outputs.present == 'true'
        run: bash scripts/bundle-budget.sh
