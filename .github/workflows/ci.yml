name: ci

on:
  push:
    branches: [main]
    # A release is a v* tag pushed by hand. The same jobs run on it, so a release
    # image is published only from a tree that still passes.
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, never a push to main: two ships minutes
  # apart share one group, and main's history must not carry a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job ids are the required status check contexts on main. Do not rename them,
  # and do not give them a `name:` — that would change the context and silently
  # leave branch protection waiting on a check that never reports.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Directory.Packages.props
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet format --verify-no-changes
      - run: dotnet test --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: 26.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job is a required check, so it must report a conclusion even before
      # frontend/ exists. Skipped jobs never report, which would leave every pull
      # request unmergeable — so the job always runs and gates its real work on
      # the directory being there.
      - id: detect
        run: |
          if [ -d frontend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ does not exist yet — nothing to check."
          fi

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npx eslint . --max-warnings 0

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npx vitest run

      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      # The budget and the "was anything actually built" guard live in the script,
      # so CI and scripts/verify.sh cannot drift apart.
      - if: steps.detect.outputs.present == 'true'
        run: bash scripts/bundle-budget.sh

  # Builds the image on every event, pushes it on none but a push to main. Two
  # jobs' worth of intent in one on purpose: a Dockerfile built only after merge
  # is one whose regressions are found on main, and building it twice would
  # double the work to no end. So the build always runs and `push:` below is the
  # conditional part.
  #
  # Safe to require as a status check, unlike the earlier push-only version: it
  # now reports a conclusion on pull requests. Whether it SHOULD be required is
  # another question, and probably no — it is slower than either job above, and a
  # broken Dockerfile does not make a source change wrong.
  publish:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Longer than the two jobs above because it does both their work again inside
    # a container build, for two architectures. Not much longer: the Dockerfile
    # pins its build stages to $BUILDPLATFORM and cross-publishes, so npm and the
    # .NET SDK run natively on the runner and only the runtime stage — which has
    # no RUN in it — is assembled per architecture. The arm64 leg is not optional
    # whatever it costs: the reference deployment is a Raspberry Pi.
    timeout-minutes: 30
    permissions:
      # Here rather than in the workflow's top-level `permissions`, which stays
      # contents: read. This is the only job that publishes anything, and a
      # top-level packages: write would hand a registry token to every step of
      # every job — including the ones that check out and run a pull request's
      # own code.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr.io refuses an uppercase path and github.repository preserves the case
      # the owner and repository were named with, so the reference is lowercased
      # here. The sha tag carries the commit's first seven characters, which is
      # what makes a running container traceable back to one by eye. The moving
      # tag is the branch's own name rather than the literal "main", so it follows
      # `on.push.branches`, and it is emitted only on a push because a pull
      # request's ref name is `104/merge` and a slash is not legal in a tag. The
      # `push:` flag below cannot save it: buildx validates every tag it is handed
      # before deciding whether to push one. On a release tag the moving tag is
      # the version, and `latest` follows the newest release.
      - id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "moving=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
          fi

      # buildx supplies the driver that can emit a manifest list at all — the
      # default docker driver builds one platform and stops. QEMU registers the
      # binfmt handlers a foreign-architecture RUN would need; the Dockerfile is
      # written so that none happens, and this stays as the thing that keeps a
      # RUN added to the runtime stage from failing on one architecture only.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The token is the one the runner already has, scoped by the block above
      # and expiring with the job. No personal access token is stored anywhere.
      # Skipped on a pull request, where there is nothing to push and where a
      # fork's GITHUB_TOKEN is read-only and this step would simply fail.
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # False on a pull request: the image is built, both architectures, and
          # then discarded. What that buys is the answer to "does the Dockerfile
          # still build", which is the only question a pull request can ask about
          # it and the one that otherwise waits until after the merge.
          push: ${{ github.event_name == 'push' }}
          # Two tags on a push, and they answer different questions. The sha tag
          # is immutable and is what a deployment pins to; the branch tag moves
          # and is what says which build is current. A third, `latest`, only on
          # a release tag. On a pull request the second and third are empty,
          # which this action drops from the list — see the step above for why
          # it cannot simply be written out and left to `push: false`.
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.moving }}
            ${{ steps.image.outputs.latest }}
          # Read always, written only from main. A pull request reuses the layers
          # main last published — npm ci and dotnet restore, which are the slow
          # ones — and cannot poison what the next one reads. An empty cache-to
          # is how buildx is told not to export, and a fork's job could not write
          # to this cache anyway.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
